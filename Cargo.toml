[workspace]
members = [
  "crates/presolve_compiler",
  "crates/presolve_cli",
  "crates/presolve_parser",
  "crates/presolve_parser_spike",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fierstdev/presolve"
version = "0.1.0-alpha.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
