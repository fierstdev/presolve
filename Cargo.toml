[workspace]
resolver = "2"
members = [
    "crates/presolve-core",
    "crates/presolve-capability",
    "crates/presolve-capability-bridge",
    "crates/presolve-contract",
    "crates/presolve-environment",
    "crates/presolve-runtime",
    "crates/presolve-bundle",
    "crates/presolve-policy",
    "crates/presolve-resolver",
    "crates/presolve-provider-sdk",
    "crates/presolve-provider-realization",
    "crates/presolve-provider-conformance",
    "crates/presolve-executor-sdk",
    "crates/presolve-node",
    "crates/presolve-cli",
    "providers/kv-memory",
    "providers/kv-cloudflare",
    "providers/objects-memory",
    "executors/docker",
]
exclude = [
    "examples/hello",
    "examples/adversarial",
    "examples/kv-demo",
    "examples/objects-demo",
    "examples/multi-workload",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/fierstdev/presolve"
homepage = "https://presolve.dev"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
hex = "0.4"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "json",
] }
uuid = { version = "1", features = ["v4"] }
wasmtime = "=48.0.5"
wasmtime-wasi = "=48.0.5"

presolve-core = { path = "crates/presolve-core" }
presolve-capability = { path = "crates/presolve-capability" }
presolve-capability-bridge = { path = "crates/presolve-capability-bridge" }
presolve-contract = { path = "crates/presolve-contract" }
presolve-environment = { path = "crates/presolve-environment" }
presolve-runtime = { path = "crates/presolve-runtime" }
presolve-bundle = { path = "crates/presolve-bundle" }
presolve-policy = { path = "crates/presolve-policy" }
presolve-resolver = { path = "crates/presolve-resolver" }
presolve-provider-sdk = { path = "crates/presolve-provider-sdk" }
presolve-provider-realization = { path = "crates/presolve-provider-realization" }
presolve-provider-conformance = { path = "crates/presolve-provider-conformance" }
presolve-executor-sdk = { path = "crates/presolve-executor-sdk" }
presolve-node = { path = "crates/presolve-node" }
presolve-executor-docker = { path = "executors/docker" }

presolve-provider-kv-memory = { path = "providers/kv-memory" }
presolve-provider-kv-cloudflare = { path = "providers/kv-cloudflare" }
presolve-provider-objects-memory = { path = "providers/objects-memory" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
