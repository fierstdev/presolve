[workspace]
resolver = "2"
members = [
    "crates/presolve-core",
    "crates/presolve-contract",
    "crates/presolve-runtime",
    "crates/presolve-bundle",
    "crates/presolve-policy",
    "crates/presolve-resolver",
    "crates/presolve-provider-sdk",
    "crates/presolve-node",
    "crates/presolve-cli",
    "providers/kv-memory",
]
exclude = [
    "examples/hello",
    "examples/adversarial",
    "examples/kv-demo",
    "examples/multi-workload",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/fierstdev/presolve"
homepage = "https://presolve.dev"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
hex = "0.4"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "json",
] }
uuid = { version = "1", features = ["v4"] }
wasmtime = "=48.0.5"
wasmtime-wasi = "=48.0.5"

presolve-core = { path = "crates/presolve-core" }
presolve-contract = { path = "crates/presolve-contract" }
presolve-runtime = { path = "crates/presolve-runtime" }
presolve-bundle = { path = "crates/presolve-bundle" }
presolve-policy = { path = "crates/presolve-policy" }
presolve-resolver = { path = "crates/presolve-resolver" }
presolve-provider-sdk = { path = "crates/presolve-provider-sdk" }

presolve-provider-kv-memory = { path = "providers/kv-memory" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
