lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .: {}

  examples/components-context-slots: {}

  examples/counter: {}

  examples/explicit-workspace: {}

  examples/forms: {}

  examples/production-resume: {}

  framework/packages/framework-types: {}

  packages/compiler-wasm: {}

  packages/language-service:
    dependencies:
      '@presolve/compiler-wasm':
        specifier: workspace:*
        version: link:../compiler-wasm

  packages/lsp:
    dependencies:
      '@presolve/language-service':
        specifier: workspace:*
        version: link:../language-service

  packages/runtime: {}

  packages/testing: {}

  packages/vscode:
    dependencies:
      '@presolve/lsp':
        specifier: workspace:*
        version: link:../lsp
