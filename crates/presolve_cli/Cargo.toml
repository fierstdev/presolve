[package]
name = "presolve-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The Presolve compiler and application command-line interface."
readme = "README.md"
rust-version.workspace = true

[dependencies]
presolve_compiler = { package = "presolve-compiler", path = "../presolve_compiler", version = "0.1.0-alpha.7" }
presolve_parser = { package = "presolve-parser", path = "../presolve_parser", version = "0.1.0-alpha.7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[features]
browser-tests = []

[[bin]]
name = "presolve"
path = "src/main.rs"

[[test]]
name = "runtime_browser"
path = "tests/runtime_browser.rs"
required-features = ["browser-tests"]

[lints]
workspace = true
