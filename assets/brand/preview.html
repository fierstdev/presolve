<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Presolve Brand Themes</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ========================================== */
    /* THEME VARIABLES                            */
    /* ========================================== */

    .theme-dark {
      --bg-color: #09090B;        /* Zinc 950 Canvas */
      --brand-primary: #FAFAFA;   /* White for Text & Compiler */
      --brand-accent: #F59E0B;    /* Strict Amber */
      --label-color: #71717A;     /* Muted Zinc */
    }

    .theme-light {
      --bg-color: #FAFAFA;        /* Zinc 50 Canvas */
      --brand-primary: #09090B;   /* Black for Text & Compiler */
      --brand-accent: #F59E0B;    /* Strict Amber */
      --label-color: #A1A1AA;     /* Muted Zinc */
    }

    /* ========================================== */
    /* LAYOUT                                     */
    /* ========================================== */

    .theme-section {
      flex: 1;
      background-color: var(--bg-color);
      padding: 60px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 60px;
    }

    .section-title {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      color: var(--label-color);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 20px;
    }

    .logo-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center; /* Aligns all containers beautifully */
      gap: 80px;
      width: 100%;
      max-width: 1000px;
    }

    .logo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .item-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: var(--label-color);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ========================================== */
    /* LOGO COMPONENTS (Transparent)              */
    /* ========================================== */

    /* 1. Favicon */
    .icon-only {
      width: 70px;
      height: 84px;
    }

    /* 2 & 3. Horizontal Center-Aligned Lockup */
    .lockup-horizontal {
      display: flex;
      align-items: center; /* MATHEMATICAL VERTICAL CENTER */
      gap: 20px;
    }

    /* Icon Settings for Lockups */
    .lockup-icon {
      width: 70px;
      height: 84px;
    }

    /* Typography */
    .logotype {
      color: var(--brand-primary);
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      margin: 0;
    }

    /* ========================================== */
    /* ANIMATION KEYFRAMES                        */
    /* ========================================== */

    .anim-compiler {
      opacity: 0;
      transform-origin: top left;
      animation: build-compiler 4s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    .anim-artifact {
      opacity: 0;
      animation: eject-artifact 4s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    @keyframes build-compiler {
      0% { opacity: 0; transform: scaleY(0); }
      10% { opacity: 1; transform: scaleY(1); }
      90% { opacity: 1; transform: scaleY(1); }
      100% { opacity: 0; transform: scaleY(0); }
    }

    @keyframes eject-artifact {
      0%, 10% { opacity: 0; transform: translate(-10px, -10px) scale(0.8); }
      20% { opacity: 1; transform: translate(-6px, -6px) scale(1); } /* Flush */
      30%, 90% { opacity: 1; transform: translate(0, 0) scale(1); } /* Decoupled */
      100% { opacity: 0; transform: translate(10px, 10px) scale(0.8); }
    }
  </style>
</head>
<body>

  <!-- ========================================== -->
  <!-- DARK MODE                                  -->
  <!-- ========================================== -->
  <div class="theme-section theme-dark">
    <div class="section-title">Dark Mode Theme</div>

    <div class="logo-grid">

      <!-- 1. Favicon -->
      <div class="logo-item">
        <div class="icon-only">
          <svg viewBox="0 0 100 120" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
            <path d="M 10 10 H 90 V 34 H 34 V 110 H 10 Z" fill="var(--brand-primary)" />
            <rect x="40" y="40" width="50" height="50" fill="var(--brand-accent)" />
          </svg>
        </div>
        <div class="item-label">Favicon</div>
      </div>

      <!-- 2. Static Lockup -->
      <div class="logo-item">
        <div class="lockup-horizontal">
          <div class="lockup-icon">
            <svg viewBox="0 0 100 120" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
              <path d="M 10 10 H 90 V 34 H 34 V 110 H 10 Z" fill="var(--brand-primary)" />
              <rect x="40" y="40" width="50" height="50" fill="var(--brand-accent)" />
            </svg>
          </div>
          <h1 class="logotype">Presolve</h1>
        </div>
        <div class="item-label">Static Logo</div>
      </div>

      <!-- 3. Animated Lockup -->
      <div class="logo-item">
        <div class="lockup-horizontal">
          <div class="lockup-icon">
            <svg viewBox="0 0 100 120" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
              <path class="anim-compiler" d="M 10 10 H 90 V 34 H 34 V 110 H 10 Z" fill="var(--brand-primary)" />
              <rect class="anim-artifact" x="40" y="40" width="50" height="50" fill="var(--brand-accent)" />
            </svg>
          </div>
          <h1 class="logotype">Presolve</h1>
        </div>
        <div class="item-label">Animated Logo (Hero)</div>
      </div>

    </div>
  </div>

  <!-- ========================================== -->
  <!-- LIGHT MODE                                 -->
  <!-- ========================================== -->
  <div class="theme-section theme-light">
    <div class="section-title">Light Mode Theme</div>

    <div class="logo-grid">

      <!-- 1. Favicon -->
      <div class="logo-item">
        <div class="icon-only">
          <svg viewBox="0 0 100 120" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
            <path d="M 10 10 H 90 V 34 H 34 V 110 H 10 Z" fill="var(--brand-primary)" />
            <rect x="40" y="40" width="50" height="50" fill="var(--brand-accent)" />
          </svg>
        </div>
        <div class="item-label">Favicon</div>
      </div>

      <!-- 2. Static Lockup -->
      <div class="logo-item">
        <div class="lockup-horizontal">
          <div class="lockup-icon">
            <svg viewBox="0 0 100 120" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
              <path d="M 10 10 H 90 V 34 H 34 V 110 H 10 Z" fill="var(--brand-primary)" />
              <rect x="40" y="40" width="50" height="50" fill="var(--brand-accent)" />
            </svg>
          </div>
          <h1 class="logotype">Presolve</h1>
        </div>
        <div class="item-label">Static Logo</div>
      </div>

      <!-- 3. Animated Lockup -->
      <div class="logo-item">
        <div class="lockup-horizontal">
          <div class="lockup-icon">
            <svg viewBox="0 0 100 120" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
              <path class="anim-compiler" d="M 10 10 H 90 V 34 H 34 V 110 H 10 Z" fill="var(--brand-primary)" />
              <rect class="anim-artifact" x="40" y="40" width="50" height="50" fill="var(--brand-accent)" />
            </svg>
          </div>
          <h1 class="logotype">Presolve</h1>
        </div>
        <div class="item-label">Animated Logo (Hero)</div>
      </div>

    </div>
  </div>

</body>
</html>
