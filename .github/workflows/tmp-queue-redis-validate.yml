name: Temporary Redis queue validation

on:
  push:
    branches:
      - tmp/queue-redis-validate

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/queue-redis-validate
      - run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - name: Format Redis queue provider
        run: cargo fmt --all
      - name: Test Redis queue provider
        run: cargo test -p presolve-provider-queue-redis
      - name: Clippy Redis queue provider
        run: cargo clippy -p presolve-provider-queue-redis --all-targets -- -D warnings
      - name: Commit formatted provider and lockfile
        run: |
          if ! git diff --quiet -- providers/queue-redis/src/lib.rs Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add providers/queue-redis/src/lib.rs Cargo.lock
            git commit -m "style: format Redis queue provider and lockfile"
            git push origin HEAD:tmp/queue-redis-validate
          fi
