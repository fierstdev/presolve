name: Temporary object lockfile generation

on:
  push:
    branches:
      - tmp/object-lockgen

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tmp/object-lockgen

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Generate lockfile
        run: cargo generate-lockfile

      - name: Commit generated lockfile if changed
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: regenerate Cargo.lock"
          git push origin HEAD:tmp/object-lockgen
