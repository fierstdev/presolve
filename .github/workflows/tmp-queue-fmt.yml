name: Temporary queue fmt

on:
  push:
    branches:
      - tmp/queue-fmt

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/queue-fmt
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo fmt --all
      - name: Commit formatted queue provider
        run: |
          if git diff --quiet -- providers/queue-memory/src/lib.rs; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add providers/queue-memory/src/lib.rs
          git commit -m "style: format queue memory provider"
          git push origin HEAD:tmp/queue-fmt
