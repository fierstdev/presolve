name: Temporary SQL formatting validation

on:
  push:
    branches:
      - tmp/sql-fmt-validate

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tmp/sql-fmt-validate

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt

      - name: Fix stale SQL contract example
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/presolve-contract/src/lib.rs")
          text = path.read_text()
          old = 'interface = "presolve:sql/database"\n    version = "^1.0"'
          new = 'interface = "presolve:sql/database"\n    version = "^0.1"'
          if old not in text:
              raise SystemExit("expected stale SQL example was not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Run focused SQL tests
        run: cargo test -p presolve-capability -p presolve-provider-sdk

      - name: Run focused SQL Clippy
        run: cargo clippy -p presolve-capability -p presolve-provider-sdk --all-targets -- -D warnings

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/presolve-capability/src crates/presolve-provider-sdk/src crates/presolve-contract/src/lib.rs
          git commit -m "style: validate SQL capability boundary"
          git push origin HEAD:tmp/sql-fmt-validate
