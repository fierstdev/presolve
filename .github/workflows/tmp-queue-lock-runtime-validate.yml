name: Temporary queue runtime validation

on:
  push:
    branches:
      - tmp/queue-lock-runtime-validate

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capability/queue-semantics
          fetch-depth: 0

      - run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt

      - name: Format
        run: cargo fmt --all

      - name: Test queue runtime slice and update lockfile
        run: >-
          cargo test
          -p presolve-capability
          -p presolve-provider-sdk
          -p presolve-provider-conformance
          -p presolve-provider-realization
          -p presolve-provider-queue-memory
          -p presolve-runtime
          -p presolve-node

      - name: Clippy queue runtime slice
        run: >-
          cargo clippy
          -p presolve-capability
          -p presolve-provider-sdk
          -p presolve-provider-conformance
          -p presolve-provider-realization
          -p presolve-provider-queue-memory
          -p presolve-runtime
          -p presolve-node
          --all-targets -- -D warnings

      - name: Commit validated generated and formatted changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates/presolve-capability crates/presolve-provider-sdk crates/presolve-provider-conformance crates/presolve-provider-realization crates/presolve-runtime crates/presolve-node providers/queue-memory
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'queue: validate runtime binding and refresh lockfile'
          git push origin HEAD:capability/queue-semantics
