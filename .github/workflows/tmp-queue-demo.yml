name: Temporary queue demo validation

on:
  push:
    branches:
      - tmp/queue-demo-slice

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target wasm32-wasip2 --component rustfmt
      - run: cargo fmt --all
      - run: bash ./scripts/check-queue-realization.sh
