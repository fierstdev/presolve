name: Temporary SQL runtime formatter

on:
  push:
    branches:
      - tmp/sql-runtime-format

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/sql-runtime-format
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatted source to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/presolve-capability/src/sql.rs \
                  crates/presolve-provider-conformance/src/sql.rs \
                  crates/presolve-runtime/src/capabilities/sql.rs \
                  crates/presolve-runtime/src/limits.rs \
                  crates/presolve-runtime/src/runtime.rs \
                  crates/presolve-runtime/src/state.rs
          git commit -m "style: format SQL runtime slice"
          git push origin HEAD:runtime/sql-capability-binding
