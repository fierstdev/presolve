name: Release dry run

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.0
          cache: pnpm
      - run: cargo install wasm-bindgen-cli --version 0.2.108 --locked
      - run: ./scripts/release-dry-run.sh

  native-package:
    name: Native package smoke (${{ matrix.package }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            package: cli-darwin-arm64
            executable: presolve
          - os: macos-15-intel
            package: cli-darwin-x64
            executable: presolve
          - os: ubuntu-latest
            package: cli-linux-x64
            executable: presolve
          - os: windows-latest
            package: cli-win32-x64
            executable: presolve.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.0
      - name: Stage native executable
        shell: bash
        run: |
          mkdir -p "packages/${{ matrix.package }}/bin"
          printf 'native-package-smoke\n' > \
            "packages/${{ matrix.package }}/bin/${{ matrix.executable }}"
      - name: Pack and verify native package
        run: node scripts/pack-native-cli.mjs "${{ matrix.package }}" release-artifacts
      - name: Validate native publication input
        run: node scripts/publish-native-cli.mjs --dry-run release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: native-package-smoke-${{ matrix.package }}
          path: release-artifacts/*.tgz
          if-no-files-found: error

  native-publication:
    name: Native publication smoke
    needs: native-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: native-package-smoke-*
          path: release-artifacts
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.0
      - name: Validate complete native publication
        run: node scripts/publish-native-cli.mjs --dry-run --require-all release-artifacts
