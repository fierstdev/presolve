name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "site/**"
      - "wrangler.jsonc"
  pull_request:
    paths-ignore:
      - "site/**"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: >-
          rustup toolchain install stable
          --profile minimal
          --component clippy
          --component rustfmt
          --target wasm32-wasip2

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run workspace Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  typescript:
    name: TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm install --global pnpm@12.8.1

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript authoring checkpoint
        run: pnpm checkpoint:ts

  architecture:
    name: Architecture checkpoints
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: >-
          rustup toolchain install stable
          --profile minimal
          --component clippy
          --component rustfmt
          --target wasm32-wasip2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm install --global pnpm@12.8.1

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check cloud-provider boundary
        run: ./scripts/check-cloud-provider.sh

      - name: Check deterministic build and package workflow
        run: ./scripts/check-build-package.sh

      - name: Check inspection and planning workflow
        run: ./scripts/check-inspection-planning.sh

      - name: Check detached-release portability proof
        run: bash ./scripts/check-portability-proof.sh

      - name: Check detached-release provider realization
        run: bash ./scripts/check-release-realization.sh

      - name: Check documentation
        run: python3 scripts/check-docs.py

      - name: Check diff hygiene
        run: git diff --check

  redis-provider-proof:
    name: Redis provider proof
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: >-
          rustup toolchain install stable
          --profile minimal
          --target wasm32-wasip2

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify Docker
        run: docker version

      - name: Execute same detached release through memory and Redis
        run: bash ./scripts/check-release-realization.sh --redis

  docker-portability:
    name: Docker portability
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm install --global pnpm@12.8.1

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify Docker and Buildx
        run: |
          docker version
          docker buildx version

      - name: Run OCI container portability checkpoint
        run: ./scripts/smoke-container-oci.sh

      - name: Run TypeScript OCI portability checkpoint
        run: ./scripts/smoke-typescript-container-oci.sh
