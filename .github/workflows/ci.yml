name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Format
        run: cargo fmt --all --check

      - name: Test
        env:
          PRESOLVE_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: cargo test --workspace

  browser-e2e:
    name: Browser e2e
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Run browser e2e
        env:
          PRESOLVE_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: cargo test -p presolve-cli --test runtime_browser -- --nocapture
