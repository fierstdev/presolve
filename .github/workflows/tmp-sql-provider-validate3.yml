name: Temporary SQL provider validation 3

on:
  push:
    branches:
      - tmp/sql-provider-validate3

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt --target wasm32-wasip2
      - run: cargo fmt --all --check
      - run: cargo check -p presolve-provider-sql-sqlite -p presolve-provider-sql-postgres
      - run: cargo test -p presolve-provider-sql-sqlite -p presolve-provider-sql-postgres
      - run: cargo clippy -p presolve-provider-sql-sqlite -p presolve-provider-sql-postgres --all-targets -- -D warnings
      - name: Compile immutable SQL guest
        run: cargo check --manifest-path examples/sql-demo/Cargo.toml --target wasm32-wasip2
