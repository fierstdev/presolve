name: Temporary SQL runtime test compatibility

on:
  push:
    branches:
      - tmp/sql-runtime-test-compat

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runtime/sql-capability-binding
          fetch-depth: 0
      - name: Add test-only compatibility constructor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/presolve-runtime/src/state.rs')
          text = p.read_text()
          text = text.replace(
              'use presolve_provider_sdk::{\n    KeyValueProvider, ObjectRead, ObjectStoreProvider, SqlDatabaseProvider, SqlQueryResult,\n    SqlTransaction,\n};\n',
              'use presolve_provider_sdk::{\n    KeyValueProvider, ObjectRead, ObjectStoreProvider, SqlDatabaseProvider, SqlQueryResult,\n    SqlTransaction,\n};\n#[cfg(test)]\nuse presolve_provider_sdk::UnavailableSqlDatabaseProvider;\n'
          )
          needle = 'impl RuntimeState {\n'
          addition = '''impl RuntimeState {\n    #[cfg(test)]\n    #[must_use]\n    pub(crate) fn new(\n        runtime_limits: RuntimeLimits,\n        key_value_provider: Arc<dyn KeyValueProvider>,\n        object_store_provider: Arc<dyn ObjectStoreProvider>,\n    ) -> Self {\n        Self::new_with_sql(\n            runtime_limits,\n            key_value_provider,\n            object_store_provider,\n            Arc::new(UnavailableSqlDatabaseProvider),\n        )\n    }\n\n'''
          if needle not in text:
              raise SystemExit('impl RuntimeState not found')
          text = text.replace(needle, addition, 1)
          p.write_text(text)
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/presolve-runtime/src/state.rs
          git commit -m "test: retain runtime state compatibility constructor"
          git push origin HEAD:runtime/sql-capability-binding
