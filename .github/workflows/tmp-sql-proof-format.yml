name: Temporary SQL proof formatter

on:
  push:
    branches:
      - tmp/sql-proof-format

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proof/sqlite-postgres-portability
          fetch-depth: 0
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo fmt --all
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply rustfmt to SQL portability slice"
          git push origin HEAD:proof/sqlite-postgres-portability
