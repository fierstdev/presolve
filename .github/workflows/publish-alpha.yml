name: Publish alpha

on:
  push:
    tags:
      - "v0.1.0-alpha.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact prerelease version, for example 0.1.0-alpha.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify release inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify lockstep release version
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: node scripts/verify-release-version.mjs "${RELEASE_VERSION#v}"
      - run: cargo fmt --all --check
      - run: cargo test --workspace
      - run: pnpm --dir packages/create-presolve test
      - run: pnpm --dir framework/packages/presolve pack --pack-destination ../../../.release

  native-cli:
    name: Build ${{ matrix.package }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: x86_64-apple-darwin
            package: cli-darwin-x64
            executable: presolve
          - os: macos-13
            target: aarch64-apple-darwin
            package: cli-darwin-arm64
            executable: presolve
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: cli-linux-x64
            executable: presolve
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package: cli-win32-x64
            executable: presolve.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --release --locked -p presolve-cli --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p packages/${{ matrix.package }}/bin
          cp target/${{ matrix.target }}/release/${{ matrix.executable }} packages/${{ matrix.package }}/bin/${{ matrix.executable }}
      - run: pnpm --dir packages/${{ matrix.package }} pack --pack-destination ../../.release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: .release/*.tgz
          if-no-files-found: error

  publish-npm:
    name: Publish npm packages
    needs: native-cli
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: .release
          merge-multiple: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for package in .release/*.tgz; do
            npm publish "$package" --tag alpha --access public
          done
      - name: Publish compiler tooling and application handoffs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm --dir packages/compiler-wasm publish --no-git-checks
          pnpm --dir packages/language-service publish --no-git-checks
          pnpm --dir packages/lsp publish --no-git-checks
          pnpm --dir packages/testing publish --no-git-checks
          pnpm --dir metaframework/packages/application publish --no-git-checks
      - name: Publish framework, CLI, and scaffold
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm --dir framework/packages/presolve publish --no-git-checks
          pnpm --dir packages/cli publish --no-git-checks
          pnpm --dir packages/create-presolve publish --no-git-checks

  publish-vscode:
    name: Publish VS Code extension
    needs: publish-npm
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package extension
        run: npx --yes @vscode/vsce package --no-dependencies --out presolve-vscode.vsix
        working-directory: packages/vscode
      - name: Publish extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath presolve-vscode.vsix --pat "$VSCE_PAT"
        working-directory: packages/vscode
